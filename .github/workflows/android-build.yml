name: Android APK Build

# Trigger the workflow on push or pull request to the main branch
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # Allows you to run this manually from the GitHub Actions tab

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Check out the repository code
    - name: Checkout Code
      uses: actions/checkout@v4

    # Step 2: Set up the Java JDK environment
    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin' # You can also use 'zulu'
        java-version: '17'      # Change to '11' or '21' depending on your Gradle/AGP version
        cache: 'gradle'

    # Step 3: Grant execute permission for the Gradle wrapper
    - name: Grant Execute Permission for Gradlew
      run: chmod +x ./gradlew

    # Step 4: Build the Debug APK
    - name: Build Debug APK
      run: ./gradlew assembleDebug

    # Step 5: Upload the compiled APK so you can download it
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
        
