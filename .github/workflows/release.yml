name: Build React Native APK

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Install Project Dependencies
      run: |
        if [ -f package.json ]; then
          npm install
        elif [ -f Example/package.json ]; then
          cd Example && npm install
        elif [ -f example/package.json ]; then
          cd example && npm install
        fi

    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: Dynamically Locate and Build Android APK
      run: |
        # Locate the gradlew file anywhere in the repository automatically
        GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
        
        if [ -z "$GRADLEW_PATH" ]; then
          echo "Error: Could not find any gradlew wrapper file in this project layout!"
          exit 1
        fi
        
        GRADLEW_DIR=$(dirname "$GRADLEW_PATH")
        echo "Found gradle wrapper at: $GRADLEW_PATH"
        
        # Grant permissions and run compilation inside the target folder
        chmod +x "$GRADLEW_PATH"
        cd "$GRADLEW_DIR"
        ./gradlew assembleDebug

    - name: Find and Upload Final APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: auto-found-apk
        path: "**/build/outputs/apk/debug/*.apk"
        
