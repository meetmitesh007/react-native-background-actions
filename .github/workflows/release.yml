name: Build React Native APK

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Install Yarn Global
      run: npm install -g yarn

    - name: Install Dependencies via Yarn
      run: |
        cd examples/backgroundExample
        yarn install

    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '11' # Roll back to Java 11 for perfect Gradle 6 compatibility

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '6.9.4' # Use the ultimate stable Gradle 6 release to stop the type mismatch error

    - name: Fix Android Compile SDK Version
      run: |
        # Downgrade compileSdkVersion and targetSdkVersion from 34 (Java 17 required) to 33 (Java 11 compatible)
        sed -i 's/compileSdkVersion = 34/compileSdkVersion = 33/g' examples/backgroundExample/android/build.gradle
        sed -i 's/targetSdkVersion = 34/targetSdkVersion = 33/g' examples/backgroundExample/android/build.gradle
        sed -i 's/compileSdkVersion 34/compileSdkVersion 33/g' examples/backgroundExample/android/app/build.gradle
        sed -i 's/targetSdkVersion 34/targetSdkVersion 33/g' examples/backgroundExample/android/app/build.gradle

    - name: Build Android APK
      run: |
        cd examples/backgroundExample/android
        gradle assembleDebug

    - name: Find and Upload Final APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: react-native-apk
        path: "**/build/outputs/apk/debug/*.apk"
        
