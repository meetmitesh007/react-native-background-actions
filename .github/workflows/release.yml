name: Build React Native APK

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Install Yarn Global
      run: npm install -g yarn

    - name: Install Dependencies via Yarn
      run: |
        cd examples/backgroundExample
        yarn install

    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: Build Android APK
      env:
        # Force the JVM options globally so the Gradle daemon picks them up immediately
        GRADLE_OPTS: >-
          -Dorg.gradle.jvmargs="--add-opens=java.base/java.lang=ALL-UNNAMED
          --add-opens=java.base/java.io=ALL-UNNAMED
          --add-opens=java.base/java.util=ALL-UNNAMED
          --add-opens=java.base/java.util.concurrent=ALL-UNNAMED
          --add-opens=java.base/java.lang.reflect=ALL-UNNAMED"
      run: |
        cd examples/backgroundExample/android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Find and Upload Final APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: react-native-apk
        path: "**/build/outputs/apk/debug/*.apk"
        
