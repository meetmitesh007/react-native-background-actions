name: Build React Native APK

on:
  push:
    branches: [ "master" ] # Matches your active branch from the image
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18 # Standard version for modern React Native

    - name: Install Dependencies
      run: npm install # or 'yarn install' if your project uses yarn

    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: Grant Execute Permission for Gradlew
      run: chmod +x android/gradlew

    - name: Build Debug APK
      run: |
        cd android
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: react-native-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
        
