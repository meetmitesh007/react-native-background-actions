name: Build React Native APK

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Install Yarn Global
      run: npm install -g yarn

    - name: Install Dependencies via Yarn
      run: |
        cd examples/backgroundExample
        yarn install

    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '7.5'

    - name: Build Android APK
      env:
        # This direct flag turns off strict validation checks across all project tasks and modules
        GRADLE_OPTS: "-Dorg.gradle.internal.tasks.validation=false"
      run: |
        cd examples/backgroundExample/android
        gradle assembleDebug -x :app:generatePackageList

    - name: Find and Upload Final APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: react-native-apk
        path: "**/build/outputs/apk/debug/*.apk"
        
