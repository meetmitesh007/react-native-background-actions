name: Build React Native APK

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Install Yarn Global
      run: npm install -g yarn

    - name: Install Dependencies via Yarn
      run: |
        cd examples/backgroundExample
        yarn install

    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # This setup step forces GitHub to override your local gradle 6.2 with a pre-installed gradle 7.5 executable
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '7.5'

    - name: Build Android APK
      run: |
        cd examples/backgroundExample/android
        # Call global gradle instead of local ./gradlew to bypass the old config files completely
        gradle assembleDebug

    - name: Find and Upload Final APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: react-native-apk
        path: "**/build/outputs/apk/debug/*.apk"
        
