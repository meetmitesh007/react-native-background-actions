name: Build React Native APK

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Install Project Dependencies
      run: npm install --legacy-peer-deps

    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '11'
        cache: 'gradle'

    - name: Build Android APK
      run: |
        # Explicitly search for gradlew while ignoring node_modules entirely
        GRADLEW_PATH=$(find . -not -path '*/node_modules/*' -name "gradlew" | head -n 1)
        
        if [ -z "$GRADLEW_PATH" ]; then
          echo "Error: Could not find gradlew wrapper file!"
          exit 1
        fi
        
        GRADLEW_DIR=$(dirname "$GRADLEW_PATH")
        echo "Found main gradle wrapper at: $GRADLEW_PATH"
        
        chmod +x "$GRADLEW_PATH"
        cd "$GRADLEW_DIR"
        ./gradlew assembleDebug

    - name: Find and Upload Final APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: react-native-apk
        path: "**/build/outputs/apk/debug/*.apk"
        
