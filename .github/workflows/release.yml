name: Build React Native APK

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Install Yarn Global
      run: npm install -g yarn

    - name: Install Dependencies via Yarn
      run: |
        cd examples/backgroundExample
        yarn install

    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '7.5'

    - name: Standardize Legacy Build Gradle Keywords
      run: |
        find . -name "build.gradle" -exec sed -i 's/\bcompile\b/implementation/g' {} +
        find examples/backgroundExample/android -name "build.gradle" -exec sed -i 's/com.android.tools.build:gradle:.*[0-9]/com.android.tools.build:gradle:7.2.2/g' {} +
        find . -maxdepth 2 -name "build.gradle" -exec sed -i 's/com.android.tools.build:gradle:.*[0-9]/com.android.tools.build:gradle:7.2.2/g' {} +

    # This forces both the main library module and the app module to use the Android 14 SDK
    - name: Force Android SDK Version 34 Globally
      run: |
        find . -name "build.gradle" -exec sed -i 's/compileSdkVersion = .*[0-9]/compileSdkVersion = 34/g' {} +
        find . -name "build.gradle" -exec sed -i 's/compileSdkVersion .*[0-9]/compileSdkVersion 34/g' {} +
        find . -name "build.gradle" -exec sed -i 's/targetSdkVersion = .*[0-9]/targetSdkVersion = 34/g' {} +
        find . -name "build.gradle" -exec sed -i 's/targetSdkVersion .*[0-9]/targetSdkVersion 34/g' {} +

    - name: Fix Android Manifest Exported Attribute
      run: |
        MANIFEST_PATH="examples/backgroundExample/android/app/src/main/AndroidManifest.xml"
        if [ -f "$MANIFEST_PATH" ]; then
          sed -i 's/<activity/<activity android:exported="true"/g' "$MANIFEST_PATH"
          echo "Successfully injected android:exported property into AndroidManifest.xml"
        fi

    - name: Build Android APK
      run: |
        cd examples/backgroundExample/android
        gradle assembleDebug -x :app:generatePackageList -x :app:checkDebugManifest -x :react-native-background-actions:checkDebugManifest

    - name: Find and Upload Final APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: react-native-apk
        path: "**/build/outputs/apk/debug/*.apk"
        
