name: Build React Native APK

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Install Yarn Global
      run: npm install -g yarn

    - name: Install Dependencies via Yarn
      run: |
        cd examples/backgroundExample
        yarn install

    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '7.5'

    - name: Inject Global Android SDK Rule
      run: |
        cat << 'EOF' >> examples/backgroundExample/android/build.gradle
        subprojects {
            afterEvaluate { project ->
                if (project.hasProperty("android")) {
                    android {
                        compileSdkVersion 34
                        buildToolsVersion "34.0.0"
                        defaultConfig {
                            targetSdkVersion 34
                        }
                    }
                }
            }
        }
        EOF

    - name: Standardize Legacy Build Gradle Keywords
      run: |
        find . -name "build.gradle" -exec sed -i 's/\bcompile\b/implementation/g' {} +
        find examples/backgroundExample/android -name "build.gradle" -exec sed -i 's/com.android.tools.build:gradle:.*[0-9]/com.android.tools.build:gradle:7.2.2/g' {} +
        find . -maxdepth 2 -name "build.gradle" -exec sed -i 's/com.android.tools.build:gradle:.*[0-9]/com.android.tools.build:gradle:7.2.2/g' {} +

    - name: Force Modern AndroidX Support Dependencies
      run: |
        cat << 'EOF' >> examples/backgroundExample/android/build.gradle
        subprojects {
            project.configurations.all {
                resolutionStrategy.eachDependency { DependencyResolveDetails details ->
                    if (details.requested.group == 'androidx.core' && details.requested.name == 'core') {
                        details.useVersion '1.12.0'
                    }
                }
            }
        }
        EOF

    - name: Fix Android Manifest Exported Attribute
      run: |
        MANIFEST_PATH="examples/backgroundExample/android/app/src/main/AndroidManifest.xml"
        if [ -f "$MANIFEST_PATH" ]; then
          sed -i 's/<activity/<activity android:exported="true"/g' "$MANIFEST_PATH"
          echo "Successfully injected android:exported property into AndroidManifest.xml"
        fi

    - name: Patch Mismatched Library Java Source Code
      run: |
        JAVA_FILE="android/src/main/java/com/asterinet/react/bgactions/RNBackgroundActionsTask.java"
        if [ -f "$JAVA_FILE" ]; then
          python3 -c "
        import re
        with open('$JAVA_FILE', 'r') as f:
            content = f.read()
        
        pattern = r'@Override\s+public\s+void\s+onTimeout\s*\([^)]*\)\s*\{[^}]*\}'
        content = re.sub(pattern, '', content)
        
        with open('$JAVA_FILE', 'w') as f:
            f.write(content)
        "
          echo "Java source patched flawlessly via Regex matching."
        fi

    # Generates a flexible constructor that cleanly resolves structural package mapping paths
    - name: Generate Static React Native Package List File
      run: |
        TARGET_DIR="examples/backgroundExample/android/app/build/generated/rncli/src/main/java/com/facebook/react"
        mkdir -p "$TARGET_DIR"
        cat << 'EOF' > "$TARGET_DIR/PackageList.java"
        package com.facebook.react;

        import android.app.Application;
        import android.content.Context;
        import com.facebook.react.ReactPackage;
        import com.facebook.react.shell.MainPackageConfig;
        import com.facebook.react.shell.MainReactPackage;
        import java.util.Arrays;
        import java.util.ArrayList;

        public class PackageList {
          private Application application;
          private MainPackageConfig config;

          public PackageList(Object context) {
            if (context instanceof Application) {
              this.application = (Application) context;
            } else if (context instanceof Context) {
              this.application = (Application) ((Context) context).getApplicationContext();
            }
          }

          public PackageList(Object context, MainPackageConfig config) {
            this(context);
            this.config = config;
          }

          public ArrayList<ReactPackage> getPackages() {
            return new ArrayList<>(Arrays.<ReactPackage>asList(
              new MainReactPackage(config),
              new com.asterinet.react.bgactions.BackgroundActionsPackage()
            ));
          }
        }
        EOF
        echo "Static PackageList.java successfully generated."

    - name: Build Android APK
      run: |
        cd examples/backgroundExample/android
        gradle assembleDebug \
          -x :app:generatePackageList \
          -x :app:checkDebugManifest \
          -x :react-native-background-actions:checkDebugManifest
          
    - name: Find and Upload Final APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: react-native-apk
        path: "**/build/outputs/apk/debug/*.apk"
        
